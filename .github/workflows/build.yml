name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses6 libffi-dev libssl-dev cmake
          pip3 install --user buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pre-download freetype (to avoid timeout)
        run: |
          mkdir -p ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype/
          cd ~/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a/packages/freetype/
          echo "Attempting to pre-download freetype..."
          wget --tries=5 --timeout=30 -O freetype-2.14.1.tar.gz https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz || echo "Pre-download failed, will rely on buildozer retry"

      - name: Build APK (with retry)
        run: |
          for i in {1..3}; do
            echo "========== Build attempt $i =========="
            if buildozer android debug; then
              echo "Build succeeded!"
              exit 0
            else
              echo "Build attempt $i failed, waiting 60 seconds before retry..."
              sleep 60
            fi
          done
          echo "All build attempts failed."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchfinder-apk
          path: bin/*.apk
